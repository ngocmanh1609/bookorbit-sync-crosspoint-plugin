name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build the plugin zip
        id: build
        run: |
          VERSION=$(node -p "require('./cp-orbit.crosspoint-plugin/manifest.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          sh scripts/package.sh "$GITHUB_REF_NAME"
          test -f "docs/release-notes/$VERSION.md"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/cp-orbit-$VERSION.zip" \
            --title "cp-orbit $VERSION" \
            --notes-file "docs/release-notes/$VERSION.md"
